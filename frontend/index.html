<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Orbitals</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231e1e1e%27/%3E%3Cellipse cx=%2716%27 cy=%278.5%27 rx=%274.2%27 ry=%277%27 fill=%27%23ff9f43%27/%3E%3Cellipse cx=%2716%27 cy=%2723.5%27 rx=%274.2%27 ry=%277%27 fill=%27%2354a0ff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header class="top">
    <h1>Atomic Orbitals</h1>
    <span class="sub">real orbitals 1s to 8s &middot; &sigma; = Zr/a<sub>0</sub> &middot; 60 orbitals &middot; computed by a Java backend</span>
  </header>

  <div class="layout">
    <!-- ================= left: choose the orbital and the settings ================= -->
    <aside class="side">
      <section class="card">
        <h2>Orbital</h2>
        <div id="shells" class="shells" role="group" aria-label="Subshell"></div>
        <div id="orients" class="orients" role="group" aria-label="Orientation"></div>
      </section>

      <section class="card">
        <h2>Atom and cloud</h2>
        <div class="ctl">
          <div class="lab"><label for="zNum">Nuclear charge Z</label><input type="number" id="zNum" min="1" max="118" step="1" value="1"></div>
          <input type="range" id="zRange" min="1" max="20" step="1" value="1" aria-label="Nuclear charge Z">
        </div>
        <div class="ctl">
          <div class="lab"><label for="count">Dots</label><b id="countVal"></b></div>
          <input type="range" id="count" min="5000" max="150000" step="5000" value="40000">
        </div>
        <div class="ctl">
          <div class="lab"><label for="dot">Dot size</label><b id="dotVal"></b></div>
          <input type="range" id="dot" min="0.5" max="3" step="0.1" value="1">
        </div>
        <label class="ctl"><span class="lab">Colour</span>
          <select id="colour">
            <option value="sign">Sign of &psi; (orange +, blue &minus;)</option>
            <option value="radius">Distance from the nucleus</option>
          </select>
        </label>
        <div class="row">
          <label class="chk"><input type="checkbox" id="showNodes" checked> Radial nodes</label>
          <label class="chk"><input type="checkbox" id="showNucleus" checked> Nucleus</label>
          <button id="resample" title="Draw a new random set of dots">Resample</button>
        </div>
      </section>

      <section class="card">
        <h2>Properties</h2>
        <dl id="props" class="props"></dl>
      </section>

      <details class="card">
        <summary>Formulas for this orbital</summary>
        <div id="formulas" class="formula"></div>
      </details>
    </aside>

    <!-- ================= centre: the 3D cloud ================= -->
    <section class="card stage">
      <div class="chips" id="chips"></div>
      <div class="plot" id="plot">
        <canvas id="cv" tabindex="0" aria-label="3D electron cloud"></canvas>
        <div class="toolbar">
          <button data-view="iso">Iso</button><button data-view="xy">x-y</button><button data-view="xz">x-z</button><button data-view="yz">y-z</button>
          <label class="chk"><input type="checkbox" id="rot"> Rotate</label>
        </div>
        <div class="msg" id="msg" hidden></div>
        <div class="hint">drag: rotate &middot; wheel: zoom &middot; double-click: reset view</div>
      </div>
    </section>

    <!-- ================= right: radial plot and cross-section ================= -->
    <aside class="right">
      <section class="card">
        <h2>Radial probability</h2>
        <div class="mini"><canvas id="radial" aria-label="Radial probability density"></canvas></div>
      </section>
      <section class="card">
        <h2>Cross-section through the nucleus</h2>
        <div class="row" style="margin-top:0">
          <button data-plane="xy">x-y</button><button data-plane="xz" class="on">x-z</button><button data-plane="yz">y-z</button>
          <select id="sliceMode" style="flex:1;min-width:110px" aria-label="Cross-section shows">
            <option value="psi">&psi; (orange +, blue &minus;)</option>
            <option value="density">|&psi;|&sup2;</option>
          </select>
        </div>
        <div class="mini square"><canvas id="slice" aria-label="Cross-section of the orbital"></canvas></div>
      </section>
    </aside>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/colors.js"></script>
<script src="js/view3d.js"></script>
<script src="js/plots.js"></script>
<script src="js/app.js"></script>
</body>
</html>
